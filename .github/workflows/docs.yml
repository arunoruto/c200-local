name: CI and Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Privacy and host tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.21'
      - name: Install locked environment
        run: uv sync --locked --group analysis
      - name: Audit all tracked public source
        run: uv run --locked python scripts/build_public_bundle.py --check-tracked
      - name: Fetch checksum-pinned offline test fixture
        run: |
          uv run --locked python scripts/fetch_assets.py --asset c200v2-1.1.15.bin
          mkdir -p firmware/v2-1.1.15
          cp work/downloads/c200v2-1.1.15.bin firmware/v2-1.1.15/Tapo_C200v2_en_1.1.15_Build_211112_Rel.10589n__1637888842077.bin
      - name: Run host tests without a camera
        run: uv run --locked python -m unittest discover -s tests -v

  build:
    name: Build and audit Hugo
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.21'
      - name: Configure Pages for deployment
        id: pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Prepare pinned website dependencies
        run: uv run --locked python scripts/site.py prepare
      - name: Build and validate links
        env:
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: uv run --locked python scripts/site.py build --base-url "${SITE_BASE_URL%/}/"
      - name: Audit rendered website
        run: uv run --locked python scripts/build_public_bundle.py --check-tracked --site-dir docs/public
      - name: Upload only static Pages output
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/public

  deploy:
    name: Deploy GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
